<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a24"/>
      <stop offset="55%" stop-color="#070712"/>
      <stop offset="100%" stop-color="#04030a"/>
    </linearGradient>
    <linearGradient id="prism" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ff7ab3"/>
      <stop offset="38%" stop-color="#ff3d8a"/>
      <stop offset="70%" stop-color="#3dfff3"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <polygon points="600,210 880,520 320,520" fill="url(#prism)" filter="url(#glow)" opacity="0.96"/>
  <polygon points="600,270 760,490 440,490" fill="#f4f1ff" opacity="0.16"/>
  <polygon points="268,168 296,220 240,220" fill="#ff3d8a"/>
  <polygon points="930,188 958,240 902,240" fill="#3dfff3"/>
  <polygon points="980,300 1008,352 952,352" fill="#ffd166"/>
  <polygon points="220,300 244,344 196,344" fill="#ffd166"/>
  <text x="600" y="92" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="800" fill="#f4f1ff" letter-spacing="10">PRISM GATE</text>
  <text x="600" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#3dfff3" letter-spacing="3">TAP TO CYCLE HUES. MATCHING SHARDS PASS.</text>
</svg>
